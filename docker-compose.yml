version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sadarproperties-app:latest
    container_name: sadarproperties_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:10001:3001"
    volumes:
      - .env:/app/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: sadarproperties_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
